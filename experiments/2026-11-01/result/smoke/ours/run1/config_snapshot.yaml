command:
- train.py
- --config
- configs/instance.yaml
- configs/env.yaml
- configs/algo.yaml
- configs/paper.yaml
- configs/smoke.yaml
- --run-name
- smoke/ours/run1
- --smoke
config_files:
- configs/instance.yaml
- configs/env.yaml
- configs/algo.yaml
- configs/paper.yaml
- configs/smoke.yaml
seed: 42
paradigm: generalization
instance_selection: round_robin
instances:
- TRN1177_DDT502_num78.txt
- TRN1188_DDT514_num95.txt
- TRN1061_DDT515_num77.txt
n_train_instances: 3
eval_scope: selected
val_every: 1
val_data_dir: data/instances/benchmark
eval_tiers:
- benchmark
algorithm: ppo
model_type: hgnn
train_version: 2
start_iteration: 0
max_iterations: 2
rollout_device: cpu
update_device: cuda:0
git_commit: unknown
python: 3.10.18
torch: 2.1.2+cu118
gurobipy_available: false
fluid_backend: scipy
model_paras:
  in_size_ma: 5
  out_size_ma: 16
  in_size_ope: 12
  out_size_ope: 16
  hidden_size_ope: 256
  num_heads:
  - 1
  - 1
  dropout: 0.0
  n_latent_actor: 128
  n_latent_critic: 128
  n_hidden_actor: 3
  n_hidden_critic: 3
  action_dim: 1
  epsilon: 1.0
  device: cuda:0
  actor_in_dim: 64
  critic_in_dim: 32
  use_sparse_attention: true
  sparse_attention_scope: pair
  sparse_attention_heads: 1
  sparse_attention_dropout: 0.0
train_paras:
  lr: 0.0003
  min_lr: 0.0003
  lr_schedule: none
  betas:
  - 0.9
  - 0.999
  gamma: 1.0
  gae_lambda: 0.95
  K_epochs: 3
  eps_clip: 0.2
  A_coeff: 1.0
  vf_coeff: 0.5
  entropy_coeff: 0.01
  max_grad_norm: 0.5
  target_kl: 0.03
  max_iterations: 2
  minibatch_size: 128
  max_minibatch_tokens: 0
  num_envs: 2
  num_workers: 2
  rollout_device: cpu
  update_device: cuda:0
  resume: none
  checkpoint_interval: 1
  experiment_name: HGNNPPO-NF
  eval_every: 1
  checkpoint_every: 1
  eval_scope: selected
  val_every: 1
  early_stop_patience: 0
  discard_penalty: 1.0
  progress_reward_coeff: 0.0
  order_top_k: 5
  fluid_mode: cached_lp
  fluid_backend: scipy
  fluid_features: 'on'
  fluid_mask: true
  fluid_mask_threshold: 1.0e-05
  fluid_recompute: decision
  fluid_time_limit: 2
  fluid_threads: 1
  collector_workers: 0
  collector_start_method: spawn
  use_sparse_attention: true
  sparse_attention_scope: pair
  sparse_attention_heads: 1
  sparse_attention_dropout: 0.0
  viz: false
  viz_name: HGNN_PPO_Training
  visdom_server: http://localhost
  visdom_port: 8097
  viz_update_interval: 1
  viz_metrics:
  - reward
  - mean_return
  - fulfillment_rate_mean
  - loss
  - policy_loss
  - value_loss
  - entropy
  - approx_kl
  - clip_fraction
  - learning_rate
  - steps_per_second
  - transitions
  - episode_count
  - episode_transition_mean
  - episode_transition_std
  - rollout_seconds
  - update_seconds
  - episode_seconds_mean
  - episode_seconds_std
  - elapsed_seconds
  - fluid_solve_count
  - fluid_solve_seconds
  - fluid_cache_hit_count
  - fluid_fallback_count
  - sparse_attention_enabled
  - sparse_attention_scope
  - policy_forward_count
  - policy_forward_seconds
  - avg_action_tokens
  - max_action_tokens
  - padding_ratio
  - actor_batch_size_mean
  - policy_act_seconds
  - simulator_step_seconds
  - obs_build_seconds
  - cpu_memory_mb
  - gpu_memory_mb
  - gpu_temperature
  - completion_count
  - discard_count
  replay_capacity: 50000
  replay_batch_size: 128
  updates_per_iteration: 10
  warmup_transitions: 50
  target_update_steps: 50
  target_tau: 0.0
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_iterations: 500
  td_loss: mse
  train_data_dir: data/instances/train
  train_patterns:
  - '*.txt'
  train_instances:
  - TRN1177_DDT502_num78.txt
  - TRN1188_DDT514_num95.txt
  - TRN1061_DDT515_num77.txt
  instance_selection: round_robin
  paradigm: generalization
  val_data_dir: data/instances/benchmark
  val_instances:
  - DDT500_num50.txt
  - DDT1200_num100.txt
  eval_tiers:
  - benchmark
  model_type: hgnn
  algorithm: ppo
  train_confirmed: true
  train_version: 2
