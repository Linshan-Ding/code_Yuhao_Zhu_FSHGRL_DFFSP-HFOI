# Learning algorithm, network and training schedule.
algo:
  algorithm: ppo              # ppo | a2c | dqn | ddqn
  model_type: hgnn            # hgnn (FSHGRL) | mlp (FSHGRL-NG: point-wise encoders instead of the graph)
  train_confirmed: true       # training-parameter table confirmed (v2 = configs/paper.yaml; v1 = original values)
  train_version: 2
  model:
    in_size_ma: 5             # raw machine feature width (must match environment/simulator.py)
    out_size_ma: 16           # machine embedding width
    in_size_ope: 12           # raw operation-type feature width (must match environment/simulator.py)
    out_size_ope: 16          # operation-type embedding width
    hidden_size_ope: 256      # hidden width of the MLP blocks
    num_heads: [1, 1]         # one entry per HGNN layer (its length is the number of layers); heads must be 1
    dropout: 0.0
    n_latent_actor: 128       # actor / order-actor hidden width
    n_latent_critic: 128      # critic hidden width
    n_hidden_actor: 3         # actor layers
    n_hidden_critic: 3        # critic layers
    action_dim: 1             # score per candidate
    epsilon: 1.0              # legacy epsilon-greedy start value; unused by the sparse policy path
  attention:
    use_sparse_attention: true      # self-attention over the retained candidate actions
    sparse_attention_scope: pair    # pair | pair_order
    sparse_attention_heads: 1
    sparse_attention_dropout: 0.0
  train:
    lr: 0.0003
    min_lr: 0.0003
    lr_schedule: none         # none | linear (towards min_lr)
    betas: [0.9, 0.999]
    gamma: 1.0
    gae_lambda: 0.95
    K_epochs: 3               # PPO passes over the collected transitions per iteration
    eps_clip: 0.2
    A_coeff: 1.0              # policy-loss coefficient (c1)
    vf_coeff: 0.5             # value-loss coefficient (c2)
    entropy_coeff: 0.01       # entropy coefficient (c3); the archived runs used 0.01 (docs/known-issues.md item 1)
    max_grad_norm: 0.5
    target_kl: 0.03           # early stop of the PPO passes when the approximate KL exceeds this
    max_iterations: 2000      # training iterations (v2 paper configuration; the archived v1 runs used 1000)
    minibatch_size: 512
    max_minibatch_tokens: 0   # optional token budget per minibatch; 0 disables it
    num_envs: 8               # complete episodes collected per iteration
    num_workers: 8            # legacy alias of num_envs
    rollout_device: cpu       # device for action sampling during collection
    update_device: cuda:0     # device for the PPO update (falls back to cpu when CUDA is unavailable)
    resume: auto              # auto: resume from result/<run>/last_checkpoint.pt when present | none
    checkpoint_interval: 1    # write last_checkpoint.pt every N iterations
    experiment_name: HGNNPPO-NF   # result/<experiment_name>/ (the original default name)
    eval_every: 1             # greedy evaluation on the training instance every N iterations (curve.csv); 0 disables
    checkpoint_every: 0       # additionally keep checkpoint_epoch{N:04d}.pt every N iterations; 0 disables
  viz:
    viz: false                # live Visdom charts (set true and start `python -m visdom.server`)
    viz_name: HGNN_PPO_Training
    visdom_server: http://localhost
    visdom_port: 8097
    viz_update_interval: 1
    viz_metrics: [reward, mean_return, fulfillment_rate_mean, loss, policy_loss, value_loss, entropy,
                  approx_kl, clip_fraction, learning_rate, steps_per_second, transitions, episode_count,
                  episode_transition_mean, episode_transition_std, rollout_seconds, update_seconds,
                  episode_seconds_mean, episode_seconds_std, elapsed_seconds, fluid_solve_count,
                  fluid_solve_seconds, fluid_cache_hit_count, fluid_fallback_count,
                  sparse_attention_enabled, sparse_attention_scope, policy_forward_count,
                  policy_forward_seconds, avg_action_tokens, max_action_tokens, padding_ratio,
                  actor_batch_size_mean, policy_act_seconds, simulator_step_seconds, obs_build_seconds,
                  cpu_memory_mb, gpu_memory_mb, gpu_temperature, completion_count, discard_count]
  offpolicy:                  # DQN / DDQN baselines only (configs/baselines/*.yaml); ignored by PPO and A2C
    replay_capacity: 50000    # transitions kept in the replay buffer
    replay_batch_size: 128
    updates_per_iteration: 50 # gradient steps after each collection of num_envs episodes
    warmup_transitions: 500   # no updates before the replay holds this many transitions
    target_update_steps: 50   # gradient steps between hard target-network copies (once per iteration)
    target_tau: 0.0           # > 0: soft target update with this rate instead of hard copies
    epsilon_start: 1.0        # epsilon-greedy exploration, linear decay (the original formula)
    epsilon_end: 0.01
    epsilon_decay_iterations: 500
    td_loss: mse              # mse (original) | huber
