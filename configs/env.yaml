# Simulator: reward shaping, candidate truncation and fluid guidance.
env:
  discard_penalty: 1.0        # reward penalty per discarded order (normalised by the order count)
  progress_reward_coeff: 0.0  # optional progress term on the change of the fulfilment rate; 0 disables it
  order_top_k: 5              # most urgent waiting orders kept per operation type (EDD order)
  fluid_mode: cached_lp       # cached_lp (capacity-allocation LP) | heuristic | off (no fluid guidance at all)
  fluid_backend: scipy        # LP solver of cached_lp: scipy (HiGHS via scipy.optimize.linprog, exact, no licence;
                              # the solver of record), auto (HiGHS, else the heuristic fallback), heuristic,
                              # gurobi (original model, unsupported: heuristic without gurobipy)
  fluid_features: "on"        # on | off: the two fluid node features raw_opes[:, 8:10] (off = zero columns; FSHGRL-NF)
  fluid_mask: true            # fluid-guided candidate mask: keep the eligible (machine, operation-type) pairs with
                              # u* > fluid_mask_threshold, fall back to every eligible pair when none is kept;
                              # needs an LP solution (cached_lp with scipy / gurobi); false = FSHGRL-NM
  fluid_mask_threshold: 1.0e-5   # epsilon_f of the paper (1e-5 = "positive allocation", the historical value)
  fluid_recompute: decision   # re-solve the LP at every decision with a new state signature (cached by state);
                              # event = legacy behaviour (only after arrivals / discards), unusable with the mask
  fluid_time_limit: 2         # LP time limit in seconds (0 = unlimited)
  fluid_threads: 0            # solver threads of the gurobi backend only (HiGHS is single-threaded and deterministic)
  collector_workers: 0        # 0 = simulators in the trainer process (original path); N > 0 = N worker processes step the
                              # environments and build the observations while the policy stays in the trainer; numerically
                              # identical (tests/test_collector.py, python -m tests.equivalence --collector-workers 3);
                              # measure with tools/profile_collector.py before enabling (see README section 2)
  collector_start_method: spawn   # spawn (default, Windows-safe) | fork | forkserver; spawn is forced when CUDA is used
