# Instance set, paradigm and generator settings (the configuration of the paper's experiments).
instance:
  problem: dffsp_hfoi                 # dynamic flexible flow shop, high-frequency order insertion
  paradigm: generalization            # generalization (one policy per method, trained on the generated pool and
                                      # evaluated on unseen tiers; Section 5.1) | per_instance (train = evaluation instance)
  data_dir: data/instances/train      # training pool: 1000 generated instances (seeds 1000-1999), one per iteration
  patterns: ["*.txt"]                 # glob patterns used when train_instances is empty
  train_instances: []                 # empty = every instance of the pool; `--instances` on the CLI has priority
  instance_selection: round_robin     # round_robin (iteration k trains on pool instance k, sorted ids) | fixed | random
  val_data_dir: data/instances/benchmark   # validation instances (model selection, val_curve.csv)
  val_instances: [DDT500_num50.txt, DDT1200_num100.txt]   # the two training-curve instances of Fig. 7; [] = every file
  eval_tiers: [benchmark, arrival, small]   # unseen tiers evaluated by scripts/run_07: the fifteen benchmark
                                      # configurations (Tables 7-11), the arrival regimes (Section 5.7) and the small
                                      # instances of the exact check and the sensitivity analysis (Appendix A, 5.8)
  generator:                          # data/generator.py; defaults matched to the benchmark statistics
    n_products: 5
    n_stages: 5
    machines_per_stage: 5
    process_time_range: [25, 450]     # seconds, discrete uniform per (product, machine)
    inter_arrival_range: [1, 40]      # seconds, discrete uniform (mean 20.5 s; benchmark files 14.5-22 s)
    ddt_range: [500, 1600]            # due-date tightness drawn per instance
    slack_rule: ddt_uniform           # order slack uniform in slack_rel_range x DDT (per_order = the per-order rule)
    slack_rel_range: [0.6, 1.55]      # benchmark files: slack in about [0.6, 1.55] x DDT
    n_orders_range: [50, 150]
  pools:                              # generated tiers written by scripts/run_01_prepare_data.py (seeds fixed)
    train:                            # training pool of the generalisation paradigm: one instance per iteration
      tier: train
      prefix: TRN
      seed: 1000                      # seeds 1000 .. 1999
      n: 1000
    arrival:                          # arrival-regime tier (S = 100, DDT = 900): load levels and arrival models
      tier: arrival
      prefix: ARR
      seed: 3000
      cases:
        - {n_orders: 100, ddt: 900, arrival: {model: uniform, rho: 0.8}}
        - {n_orders: 100, ddt: 900, arrival: {model: uniform, rho: 1.2}}
        - {n_orders: 100, ddt: 900, arrival: {model: uniform, rho: 1.8}}
        - {n_orders: 100, ddt: 900, arrival: {model: uniform, rho: 2.6}}
        - {n_orders: 100, ddt: 900, arrival: {model: exponential, rho: 1.8}}
        - {n_orders: 100, ddt: 900, arrival: {model: bursty, rho: 1.8, burst_size: 10, burst_gap: 2}}
    small:                            # exact-solver check (baselines/milp_exact.py) and mask-threshold sensitivity
      tier: small                     # (scripts/run_10_sensitivity.py): benchmark structure 5 x 5 x 5, few orders
      prefix: SML
      seed: 5000
      grid:
        n_orders: [6, 8, 10, 12]
        ddt: [500, 900, 1500]
        seeds: 1
