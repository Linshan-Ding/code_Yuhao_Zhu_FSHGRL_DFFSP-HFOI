# Smoke overlay (scripts/run_00_smoke.py), applied after configs/paper.yaml: 2 iterations x 2 environments on
# three training-pool instances with validation on two val instances every iteration, no Visdom, a checkpoint
# every iteration (tools/eval_curve.py can be exercised on the smoke run).
instance:
  train_instances: ['TRN1177_DDT502_num78.txt', 'TRN1188_DDT514_num95.txt', 'TRN1061_DDT515_num77.txt']
  val_instances: ['VAL2000_DDT500_num50.txt', 'VAL2001_DDT500_num50.txt']
  eval_tiers: [val]
env:
  fluid_threads: 1
algo:
  train:
    max_iterations: 2
    num_envs: 2
    num_workers: 2
    minibatch_size: 128
    val_every: 1
    eval_scope: selected
    checkpoint_every: 1
    resume: none
  viz:
    viz: false
